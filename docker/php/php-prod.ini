; =============================================================
;  PHP Configuration — PRODUCTION / STAGING
;  Used in the 'production' Docker stage
; =============================================================

[PHP]
; Upload limits (match Nginx client_max_body_size)
post_max_size        = 50M
upload_max_filesize  = 20M

; Execution
max_execution_time   = 60
max_input_time       = 60
memory_limit         = 256M

; Error reporting — NEVER show errors in production
display_errors       = Off
display_startup_errors = Off
log_errors           = On
error_reporting      = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Security
expose_php           = Off
default_charset      = UTF-8
date.timezone        = Asia/Jakarta

[Session]
session.gc_maxlifetime = 7200

; =============================================================
;  OPcache — Dramatically improves performance in production
; =============================================================
[opcache]
opcache.enable                 = 1
opcache.enable_cli             = 0
opcache.memory_consumption     = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files  = 20000
opcache.revalidate_freq        = 0
; Set to 0 in production (files won't change)
opcache.validate_timestamps    = 0
opcache.fast_shutdown          = 1
opcache.save_comments          = 1
