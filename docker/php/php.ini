; =============================================================
;  PHP Configuration — DEVELOPMENT
;  Used in the 'dev' Docker stage and local dev
; =============================================================

[PHP]
; Upload limits (match Nginx client_max_body_size)
post_max_size        = 50M
upload_max_filesize  = 20M

; Execution
max_execution_time   = 60
max_input_time       = 60
memory_limit         = 256M

; Error reporting — show everything in dev
display_errors       = On
display_startup_errors = On
log_errors           = On
error_reporting      = E_ALL

; Miscellaneous
expose_php           = Off
default_charset      = UTF-8
date.timezone        = Asia/Jakarta

[Session]
session.gc_maxlifetime = 7200

[opcache]
; Keep opcache OFF in dev so code changes reflect immediately
opcache.enable       = 0
