server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN"           always;
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-XSS-Protection "1; mode=block"        always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    charset utf-8;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Main route — let Laravel handle everything
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Silence noisy log entries
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Laravel error handling
    error_page 404 /index.php;

    # PHP-FPM passthrough
    location ~ \.php$ {
        fastcgi_pass        app:9000;
        fastcgi_index       index.php;
        fastcgi_param       SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include             fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Timeouts for long-running requests
        fastcgi_read_timeout   300;
        fastcgi_send_timeout   300;
        fastcgi_connect_timeout 60;

        # Buffer tuning
        fastcgi_buffer_size        128k;
        fastcgi_buffers            4 256k;
        fastcgi_busy_buffers_size  256k;
    }

    # Cache static assets aggressively
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|css|js)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block hidden files (except .well-known for Let's Encrypt)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Increase upload size limit (matches php.ini)
    client_max_body_size 50M;
}
