# =============================================================
#  compose.staging.yml — STAGING (Homeserver/NPM Adapted)
#
#  Features:
#    - Built image (vendor + assets baked in — no volume mounts)
#    - Nginx container (port 8080) — proxied by Nginx Proxy Manager
#    - Queue worker as separate container (shares same image)
#    - MySQL NOT exposed externally (internal network only)
#    - DB user (jeb_user) auto-created on first MySQL init
#    - APP_DEBUG=true for troubleshooting staging issues
#    - Uses external homeserver-net network
#    - Uses host bind mounts under /var/lib/docker-volumes/...
#
#  Before first run on vault-01:
#    1. Set APP_KEY in .env  (php artisan key:generate --show)
#    2. Set DB_PASSWORD, DB_DATABASE, DB_USERNAME in .env
#    3. Run: docker compose -f compose.staging.yml up -d --build
#
#  After first run, seed the database:
#    docker exec -it jeb-app-staging php artisan db:seed --force
# =============================================================

services:

  # ──────────────────────────────────────────────────
  # PHP-FPM Application Server (Staging)
  # ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: jeb-app:staging
    container_name: jeb-app-staging
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: app
      TZ: Asia/Jakarta
      # Always override DB_HOST to the Docker service name
      # so it works regardless of what DB_HOST is set to in .env
      DB_HOST: db
    expose:
      - "9000"
    volumes:
      # User-uploaded files (persisted across rebuilds)
      - /var/lib/docker-volumes/sistem_informasi_Jiwa_Etnik_Blambangan/storage_staging:/var/www/html/storage/app
      # Shared public dir — lets nginx serve built assets & storage symlink
      - jeb_public_staging:/var/www/html/public
    networks:
      - homeserver-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Check that php-fpm is listening on port 9000
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  # ──────────────────────────────────────────────────
  # Nginx Web Server
  # Nginx Proxy Manager on the host forwards to :8080
  # ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: jeb-nginx-staging
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Storage bind mount so nginx can serve user-uploaded files
      - /var/lib/docker-volumes/sistem_informasi_Jiwa_Etnik_Blambangan/storage_staging:/var/www/html/storage/app
      # Shared public dir must match the app container
      - jeb_public_staging:/var/www/html/public
    networks:
      - homeserver-net
    # Wait for app to be healthy (storage:link will have run by then)
    depends_on:
      app:
        condition: service_healthy

  # ──────────────────────────────────────────────────
  # Queue Worker (processes background jobs from DB)
  # ──────────────────────────────────────────────────
  queue:
    image: jeb-app:staging
    container_name: jeb-queue-staging
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: queue
      TZ: Asia/Jakarta
      DB_HOST: db
    volumes:
      - /var/lib/docker-volumes/sistem_informasi_Jiwa_Etnik_Blambangan/storage_staging:/var/www/html/storage/app
    networks:
      - homeserver-net
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  # ──────────────────────────────────────────────────
  # MySQL 8.0 Database (internal only — not exposed)
  # ──────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: jeb-db-staging
    restart: unless-stopped
    environment:
      # Root password (used by healthcheck)
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      # Dedicated app user — created automatically on first init
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      TZ: Asia/Jakarta
    volumes:
      - /var/lib/docker-volumes/sistem_informasi_Jiwa_Etnik_Blambangan/mysql_staging:/var/lib/mysql
    networks:
      - homeserver-net
    healthcheck:
      # Use root to ping — MYSQL_USER may not have PING privilege yet
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
      # Long start_period to accommodate first-run data directory init
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

# ──────────────────────────────────────────────────
# Networks & Volumes
# ──────────────────────────────────────────────────
networks:
  homeserver-net:
    external: true

volumes:
  # Named volume shared between app and nginx containers.
  # Populated from the image on first creation; storage:link
  # symlink is created inside it by the app entrypoint.
  jeb_public_staging:
