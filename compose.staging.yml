# =============================================================
#  compose.staging.yml — STAGING (Homeserver/NPM Adapted)
#
#  Features:
#    - Built image (vendor + assets baked in — no volume mounts)
#    - Queue worker as separate container
#    - MySQL NOT exposed externally (internal network only)
#    - APP_DEBUG=true for troubleshooting
#    - Nginx commented out (handled by Nginx Proxy Manager on host)
#    - Uses external homeserver-net network
#    - Uses host bind mounts under /var/lib/docker-volumes/sistem_informasi_Jiwa_Etnik_Blambangan
# =============================================================

services:

  # ──────────────────────────────────────────────────
  # PHP-FPM Application Server (Staging)
  # ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: jeb-app:staging
    container_name: jeb-app-staging
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: app
      TZ: Asia/Jakarta
      DB_HOST: db
    expose:
      - "9000"
    volumes:
      # Persist uploaded files under docker volumes path
      - /var/lib/docker-volumes/sistem_informasi_Jiwa_Etnik_Blambangan/storage_staging:/var/www/html/storage/app
    networks:
      - homeserver-net
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  # ──────────────────────────────────────────────────
  # Nginx Web Server (Commented out - using NPM on host)
  # ──────────────────────────────────────────────────
  # nginx:
  #   image: nginx:1.27-alpine
  #   container_name: jeb-nginx-staging
  #   restart: unless-stopped
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  #     - /var/lib/docker-volumes/sistem_informasi_Jiwa_Etnik_Blambangan/storage_staging:/var/www/html/storage/app
  #   networks:
  #     - homeserver-net
  #   depends_on:
  #     - app

  # ──────────────────────────────────────────────────
  # Queue Worker (processes jobs from DB queue)
  # ──────────────────────────────────────────────────
  queue:
    image: jeb-app:staging
    container_name: jeb-queue-staging
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: queue
      TZ: Asia/Jakarta
      DB_HOST: db
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=60", "--sleep=3"]
    volumes:
      - /var/lib/docker-volumes/sistem_informasi_Jiwa_Etnik_Blambangan/storage_staging:/var/www/html/storage/app
    networks:
      - homeserver-net
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  # ──────────────────────────────────────────────────
  # MySQL 8.0 Database (internal only — not exposed)
  # ──────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: jeb-db-staging
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      TZ: Asia/Jakarta
    volumes:
      - /var/lib/docker-volumes/sistem_informasi_Jiwa_Etnik_Blambangan/mysql_staging:/var/lib/mysql
    networks:
      - homeserver-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

# ──────────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────────
networks:
  homeserver-net:
    external: true
